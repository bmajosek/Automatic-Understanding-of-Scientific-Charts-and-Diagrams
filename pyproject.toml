[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-understanding-results"
version = "0.1.0"
description = "Results pipeline for chart understanding thesis evaluation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
datasets = [
    "datasets>=2.10.0",
    "huggingface_hub>=0.15.0",
    "kaggle>=1.5.12",
]

test = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
